name: CI

on:
  pull_request:
    branches: [develop]

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile test/test.cpp
        run: g++ -std=c++17 -Wall -Wextra -o test_bin test/test.cpp

      - name: Run test
        run: ./test_bin
